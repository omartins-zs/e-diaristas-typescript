name: e-diaristas-typescript

services:
  web:
    build:
      context: .
      args:
        # A URL da API e lida em tempo de build (prefixo NEXT_PUBLIC_).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
